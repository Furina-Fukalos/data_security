# ============================================================
#  数据安全管理评估系统 —— Nginx 站点配置
#  该文件同时用于：
#    1) Docker 镜像（deploy/Dockerfile 复制到 /etc/nginx/conf.d/default.conf）
#    2) ECS 裸机部署（deploy/deploy.sh 复制到 /etc/nginx/conf.d/data_security.conf）
#  站点根目录固定为 /var/www/data_security（两种方式一致，便于排查）
# ============================================================
server {
    listen       80 default_server;
    server_name  _;

    root  /var/www/data_security;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------- 传输压缩（echarts / pdf.js 等库体积较大，gzip 收益明显） ----------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # ---------- 入口页面不缓存：更新后刷新即生效 ----------
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /user-management.html {
        add_header Cache-Control "no-store";
    }

    # ---------- 第三方库内容稳定，长缓存 ----------
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- 其余静态资源 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 安全响应头（纯静态站点，无后端） ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
    }
}
